<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Tarot Club — A Mysteries Fangame</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="description" content="A gaslamp investigation fangame. Fan project, non-commercial." />

    <!-- iOS "Add to Home Screen" behaves like a standalone app with these. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Not `black-translucent`: that pulls the page under the status bar, and the
      resulting inset has to be compensated somewhere. `black` keeps the
      viewport origin where the browser says it is.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Tarot Club" />
    <meta name="theme-color" content="#14100d" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <link rel="icon" type="image/png" href="assets/icons/icon-180.png" />

    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #14100d;
        overflow: hidden;
        /* Stop iOS rubber-band scroll and double-tap zoom inside the game. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /*
       * Phaser owns centring (Scale.CENTER_BOTH sets the canvas margins). A
       * flex parent that ALSO centres, plus safe-area padding, fights that and
       * leaves Phaser's cached canvas bounds disagreeing with where the canvas
       * actually is — which is how every tap ends up landing in the wrong
       * place. So: plain block, no padding, no flex.
       */
      #game {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #boot-error {
        display: none;
        position: fixed;
        inset: 0;
        padding: 2rem;
        color: #e8dcc8;
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #14100d;
        white-space: pre-wrap;
        overflow: auto;
      }
    </style>
    <script type="module" crossorigin src="/LotMGame/assets/index-CXoEz2-C.js"></script>
    <link rel="modulepreload" crossorigin href="/LotMGame/assets/phaser-CaWnzXme.js">
  </head>
  <body>
    <div id="game"></div>
    <pre id="boot-error"></pre>
  </body>
</html>
